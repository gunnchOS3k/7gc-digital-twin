continuity_levels: [target, degraded, min_useful, failed]
classify_rule: >
  connected → target; degraded|transitioning → degraded;
  offline AND offline_covers_workload → min_useful; else failed.
  Rule matches gunnchos_device_os.service_continuity.evaluate.classify_continuity.
gary_scenario_to_bearer_stress:
  neighborhood_outage: jam_wifi_offline_fallback
  storm_congestion: degraded_wifi
  school_bandwidth_collapse: degraded_wifi
  library_hotspot_overload: degraded_wifi
  smb_payment_system_down: force_offline
analysis:
  - Re-derive continuity levels from stored orchestrator_state + offline_covers_workload.
  - Report which class/workload/scenario is below min-useful (failed) vs at min-useful.
  - Overlay Gary bad-day names onto the frozen bearer-stress labels above.
  - Seed-wise synthetic-user demand/mobility (generate_users seed wiring).
  - Cross-site inclusion families for comparative scenario environments (not deployments).
non_claims:
  - Not RF channel sounding.
  - Not a community deployment.
  - Not University of Oulu affiliation.
  - Not SUBMITTED or ACCEPTED.
